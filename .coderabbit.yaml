reviews:
  auto_review:
    enabled: false
    labels: ["review-ready"]
    description_keyword: ""
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 1
    drafts: false
    ignore_title_keywords: ["WIP", "[skip review]", "DO NOT MERGE"]
    ignore_usernames: ["dependabot[bot]", "renovate[bot]", "github-actions[bot]"]
