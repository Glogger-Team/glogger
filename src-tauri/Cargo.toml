[package]
name = "glogger"
version = "1.7.0"
description = "Project: Gorgon Log Watcher and Data Tracker"
authors = ["Daniel"]
license = "GPL-3.0"
repository = "https://github.com/Glogger-Team/glogger"
edition = "2021"

[lib]
name = "glogger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "array"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
once_cell = "1"
zip = "9"

[profile.release]
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# GDI window capture for the stall price OCR scanner (Phase B).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
