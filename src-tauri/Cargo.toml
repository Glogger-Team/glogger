[package]
name = "glogger"
version = "1.17.4"
description = "Project: Gorgon Log Watcher and Data Tracker"
license = "GPL-3.0"
repository = "https://github.com/Glogger-Team/glogger"
edition = "2024"

[lib]
name = "glogger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "array"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
once_cell = "1"
zip = "9"
specta = { version = "=2.0.0-rc.27", features = ["derive"] }

[dev-dependencies]
# `tauri::test::mock_app` (replay preview regression test) is gated behind
# the empty `test` feature; features unify, so this only affects test builds.
tauri = { version = "2", features = ["test"] }
specta-serde = "0.0.14"
specta-typescript = "0.0.14"

[profile.release]
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
