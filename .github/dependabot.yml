version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    groups:
      tauri:
        patterns:
          - "tauri*"
          - "wry"
          - "tao"
      sqlite:
        patterns:
          - "rusqlite*"
          - "r2d2*"
          - "libsqlite3-sys"
          - "hashlink"
      zip:
        patterns:
          - "zip"
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
          - "pinia"
          - "@vitejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      build:
        patterns:
          - "vite"
          - "typescript"
          - "vue-tsc"
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
