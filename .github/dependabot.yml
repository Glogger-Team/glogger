version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    groups:
      tauri:
        patterns:
          - "tauri*"
          - "wry"
          - "tao"
      sqlite:
        patterns:
          - "rusqlite*"
          - "r2d2*"
          - "libsqlite3-sys"
          - "hashlink"
      zip:
        patterns:
          - "zip"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
          - "pinia"
          - "@vitejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      build:
        patterns:
          - "vite"
          - "typescript"
          - "vue-tsc"
    # vue-tsc resolves the compiler via typescript/lib/tsc, removed in
    # the TS 7 native rewrite (PR #41 crashed ERR_PACKAGE_PATH_NOT_EXPORTED
    # before checking a file). Revisit when vue-tsc supports TS 7.
    # Note: version-update ignores don't block security updates — a TS
    # security release would still arrive as a PR and fail the frontend gate.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
