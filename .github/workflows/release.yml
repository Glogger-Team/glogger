name: Release

# Tag push v<semver> from main -> test gate, signed Windows / macOS / Linux
# builds, GitHub Release on this fork, then refresh latest.json on the
# `updater-latest` pointer release (that tag URL is the updater endpoint
# compiled into the app, so it stays stable while the asset behind it is
# replaced on every release).
#
# The validate job also runs the game-interaction hard-line scanner
# (scripts/check-glogger-constraints.ps1, the same gate as the local pre-push
# hook — see docs/research/glogger-game-interaction-limits.md), so a skipped or
# uninstalled local hook cannot let a TOS/CoC violation reach a release.
#
# Release notes come from RELEASE_NOTES.md, committed by scripts/release.sh
# (generated from the commits since the previous release tag, or hand-written
# via `--notes <file>`): the validate job fails a tag push whose notes are
# missing or cover the wrong range, and the publish job puts them in the
# GitHub Release body and in latest.json's `notes`.
#
# workflow_dispatch rebuilds the identical matrix for an existing ref with
# `publish` left false, so the pipeline can be smoke-tested (all three
# platforms, no release created) before cutting a real tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag or branch to build (e.g. v1.1.0, main)"
        required: true
        default: main
        type: string
      publish:
        description: "Create the GitHub Release + refresh the update channel"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  CHANNEL_TAG: updater-latest

jobs:
  # ── Resolve the version + frontend type gate ──
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          # full history + tags: the release-notes check needs the previous
          # release tag to know which range RELEASE_NOTES.md must cover.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type-check and build
        run: npm run build

      - name: Resolve version (must match the pushed tag)
        id: version
        shell: bash
        env:
          REF_VALUE: ${{ inputs.ref || github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(awk -F'"' '/"version"/ {print $4; exit}' src-tauri/tauri.conf.json)
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not read the version from src-tauri/tauri.conf.json"
            exit 1
          fi
          # A tag-triggered release must match the committed version: the asset
          # names, release tag and latest.json all derive from it.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "v${VERSION}" ]; then
            echo "ERROR: tag $REF_NAME != tauri.conf.json version v${VERSION} — was the bump committed before tagging?"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "building v$VERSION from $REF_VALUE"

      - name: Game-interaction hard lines (TOS/CoC)
        shell: pwsh
        run: ./scripts/check-glogger-constraints.ps1

      - name: Verify release notes
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # RELEASE_NOTES.md is generated and committed by scripts/release.sh,
          # so a tag push always carries notes for its own range. This is a
          # tripwire for tags cut some other way — a warning (not an error) on
          # workflow_dispatch, where historical tags are smoke-tested.
          #
          # The base is the last *published* GitHub Release, not the nearest
          # tag: a tag whose Release run failed never reached users, so the
          # next release's notes must still cover its commits (v1.3.8 -> v1.3.9
          # shipped notes that omitted everything the failed 1.3.8 contained).
          PREV_TAG=$(bash scripts/last-published-tag.sh "$REPO" 2>/dev/null || git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || echo "")
          PROBLEM=""
          if [ ! -s RELEASE_NOTES.md ]; then
            PROBLEM="RELEASE_NOTES.md is missing or empty"
          elif ! grep -q "What's Changed since" RELEASE_NOTES.md; then
            PROBLEM="RELEASE_NOTES.md has no 'What's Changed since …' section"
          elif [ -n "$PREV_TAG" ] && ! grep -qE "since ${PREV_TAG}([^0-9]|$)" RELEASE_NOTES.md; then
            PROBLEM="RELEASE_NOTES.md does not cover the changes since ${PREV_TAG}"
          fi

          if [ -z "$PROBLEM" ]; then
            echo "release notes OK (since ${PREV_TAG:-the initial release})"
            cat RELEASE_NOTES.md
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            echo "ERROR: $PROBLEM."
            echo "Cut releases with 'npm run release <patch|minor|major|x.y.z>', which generates RELEASE_NOTES.md and commits it with the bump."
            exit 1
          fi
          echo "::warning title=Release notes::$PROBLEM (a tag push would fail here)"

  # ── Build every platform we ship, each gated by its own test run ──
  build:
    needs: validate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    # Signing secrets (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]) are scoped to this
    # environment rather than floating as repo-wide secrets.
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
            target: ""
            args: ""
          - platform: macos-latest
            label: macos
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-latest
            label: linux
            target: ""
            args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        # Master-history SHA, not the `stable` branch head: upstream force-pushes
        # `stable` on every toolchain release and non-master commits get GC'd
        # (upstream README requires a master-history SHA; a pinned stable head
        # goes dangling). `toolchain: stable` preserves the old `@stable` behavior.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Smoke-test dispatches restore but never save: only tag pushes write
          # the cache releases read. No pull_request trigger exists, so no
          # untrusted run can poison it; this narrows the writers to releases.
          save-if: ${{ github.event_name == 'push' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build release installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true

      - name: Collect installer
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p release-artifacts
          # macOS cross-compiles into target/<triple>/release/bundle, native
          # builds land in target/release/bundle. `-print -quit` avoids piping
          # find into head, which SIGPIPEs under the runner's `set -o pipefail`.
          BUNDLE_DIR=$(find src-tauri/target -path "*/release/bundle" -type d -print -quit)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "ERROR: no bundle dir"
            find src-tauri/target -name bundle -type d
            exit 1
          fi
          echo "bundle dir: $BUNDLE_DIR"
          find "$BUNDLE_DIR" -maxdepth 2 -type f | head -40 || true

          case "$LABEL" in
            windows)
              REQUIRED=("glogger-${VERSION}-windows-setup.exe" "glogger-${VERSION}-windows-setup.exe.sig")
              cp "$BUNDLE_DIR"/nsis/*.exe "release-artifacts/glogger-${VERSION}-windows-setup.exe"
              cp "$BUNDLE_DIR"/nsis/*.exe.sig "release-artifacts/glogger-${VERSION}-windows-setup.exe.sig"
              ;;
            macos)
              REQUIRED=("glogger-${VERSION}-macos.dmg" "glogger-${VERSION}-macos.app.tar.gz" "glogger-${VERSION}-macos.app.tar.gz.sig")
              cp "$BUNDLE_DIR"/dmg/*.dmg "release-artifacts/glogger-${VERSION}-macos.dmg"
              cp "$BUNDLE_DIR"/macos/*.tar.gz "release-artifacts/glogger-${VERSION}-macos.app.tar.gz"
              cp "$BUNDLE_DIR"/macos/*.tar.gz.sig "release-artifacts/glogger-${VERSION}-macos.app.tar.gz.sig"
              ;;
            linux)
              REQUIRED=("glogger-${VERSION}-linux.deb" "glogger-${VERSION}-linux.AppImage" "glogger-${VERSION}-linux.AppImage.sig")
              cp "$BUNDLE_DIR"/deb/*.deb "release-artifacts/glogger-${VERSION}-linux.deb"
              cp "$BUNDLE_DIR"/appimage/*.AppImage "release-artifacts/glogger-${VERSION}-linux.AppImage"
              cp "$BUNDLE_DIR"/appimage/*.AppImage.sig "release-artifacts/glogger-${VERSION}-linux.AppImage.sig"
              ;;
          esac

          # Missing .sig means the build was not signed (TAURI_SIGNING_PRIVATE_KEY
          # secret absent) — never publish an artifact users cannot verify.
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "release-artifacts/$f" ]; then
              echo "ERROR: missing $f"
              MISSING=1
            fi
          done
          [ "$MISSING" = 0 ] || exit 1
          ls -la release-artifacts/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.label }}
          path: release-artifacts/*

  # ── Publish the release + refresh the update channel ──
  publish:
    needs: [validate, build]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the Release, uploads assets, moves the channel pointer
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Verify the release tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Creating the release for a dispatch run would tag the default
          # branch HEAD; require the real tag to exist first.
          gh api "repos/$REPO/git/ref/tags/$TAG" --silent || {
            echo "ERROR: tag $TAG does not exist on origin — cut it with npm run release"; exit 1; }

      - name: Checkout (at the release tag, for RELEASE_NOTES.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: all-artifacts
          merge-multiple: true

      - name: Generate latest.json updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          ls -la all-artifacts/
          mkdir -p channel

          WIN_ASSET="glogger-${VERSION}-windows-setup.exe"
          MAC_ASSET="glogger-${VERSION}-macos.app.tar.gz"
          LINUX_ASSET="glogger-${VERSION}-linux.AppImage"
          MISSING=0
          for f in "all-artifacts/$WIN_ASSET.sig" "all-artifacts/$MAC_ASSET.sig" "all-artifacts/$LINUX_ASSET.sig"; do
            [ -f "$f" ] || { echo "ERROR: missing signature $f"; MISSING=1; }
          done
          [ "$MISSING" = 0 ] || exit 1

          # The updater manifest carries the same notes the GitHub Release
          # shows; RELEASE_NOTES.md is checked out at the release tag.
          if [ -s RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md updater-notes.md
          else
            printf 'glogger v%s\n' "$VERSION" > updater-notes.md
          fi

          jq -n \
            --arg version "$VERSION" \
            --rawfile notes updater-notes.md \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg win_url "$BASE_URL/$WIN_ASSET" --arg win_sig "$(cat "all-artifacts/$WIN_ASSET.sig")" \
            --arg mac_url "$BASE_URL/$MAC_ASSET" --arg mac_sig "$(cat "all-artifacts/$MAC_ASSET.sig")" \
            --arg linux_url "$BASE_URL/$LINUX_ASSET" --arg linux_sig "$(cat "all-artifacts/$LINUX_ASSET.sig")" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "windows-x86_64": { url: $win_url, signature: $win_sig },
                 "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                 "linux-x86_64": { url: $linux_url, signature: $linux_sig }
               }
             }' > channel/latest.json

          python3 -m json.tool channel/latest.json
          echo "verified: latest.json parses"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          WIN="glogger-${VERSION}-windows-setup.exe"
          MAC="glogger-${VERSION}-macos.dmg"
          DEB="glogger-${VERSION}-linux.deb"
          APPIMAGE="glogger-${VERSION}-linux.AppImage"
          {
            echo "## Downloads"
            echo
            echo "| Platform | Installer |"
            echo "|----------|-----------|"
            echo "| **Windows** | [$WIN]($BASE_URL/$WIN) |"
            echo "| **macOS** (Apple silicon) | [$MAC]($BASE_URL/$MAC) |"
            echo "| **Linux** (Debian/Ubuntu) | [$DEB]($BASE_URL/$DEB) |"
            echo "| **Linux** (AppImage) | [$APPIMAGE]($BASE_URL/$APPIMAGE) |"
            echo "| **Linux** (Flatpak) | [glogger.flatpak]($BASE_URL/glogger.flatpak) — attached by a follow-up job; not self-updating |"
            echo
            echo "---"
            echo
            # RELEASE_NOTES.md is checked out at the release tag (generated and
            # committed by scripts/release.sh) — it opens with
            # "## What's Changed since v<previous>".
            if [ -s RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              echo "_No release notes were recorded for this release._"
            fi
            echo
            echo "---"
            echo
            echo "Installed builds auto-update from the \`$CHANNEL_TAG\` channel."
            echo
            echo "Original app by Daniel Auchenpaugh ([danielout/glogger](https://github.com/danielout/glogger)). Features, fixes and the release pipeline inherited from the [oddio fork](https://github.com/crisp-oddio/glogger-oddio) by oddio — now maintained at [Glogger-Team/glogger](https://github.com/Glogger-Team/glogger)."
            echo
            echo "---"
            echo
            # Static per-platform footnote: kept at the bottom so the notes stay
            # at the top of the release page.
            echo "<sub>**macOS:** the \`.dmg\` is unsigned (no Apple Developer certificate) — on first launch use right-click → Open, or clear the quarantine flag with \`xattr -d com.apple.quarantine /Applications/glogger.app\`.</sub>"
          } > FULL_RELEASE_NOTES.md
          gh release create "$TAG" --repo "$REPO" --title "glogger $TAG" --notes-file FULL_RELEASE_NOTES.md --latest
          gh release upload "$TAG" all-artifacts/* --repo "$REPO"

      - name: Update the update-channel pointer release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$CHANNEL_TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$CHANNEL_TAG" --repo "$REPO" \
              --title 'Update channel' --latest=false \
              --notes 'Pointer release: holds latest.json for the app updater endpoint. Replaced on every v* release — do not delete.'
          gh release upload "$CHANNEL_TAG" channel/latest.json --repo "$REPO" --clobber
          echo "channel updated: https://github.com/$REPO/releases/download/$CHANNEL_TAG/latest.json"

  # ── Flatpak bundle, built from the published tag (Linux extra, upstream parity) ──
  flatpak:
    needs: [validate, publish]
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    uses: ./.github/workflows/flatpak.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      publish: true
    permissions:
      contents: write # the called workflow's attach job uploads the bundle
