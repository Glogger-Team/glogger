name: Release

# Tag push v<semver> from main -> test gate, tauri-action direct-mode builds
# (the matrix creates a *draft* GitHub Release and uploads the bundles), then
# a single-writer channel job verifies every asset, publishes the Release,
# attaches latest.json, and refreshes the `updater-latest` pointer release
# (that tag URL is the updater endpoint compiled into the app, so it stays
# stable while the asset behind it is replaced on every release).
#
# The validate job also runs the game-interaction hard-line scanner
# (scripts/check-glogger-constraints.ps1, the same gate as the local pre-push
# hook — see docs/research/glogger-game-interaction-limits.md), so a skipped or
# uninstalled local hook cannot let a TOS/CoC violation reach a release.
#
# release (scripts/generate-changelog.sh, based via
# scripts/last-published-tag.sh). No committed RELEASE_NOTES.md, no version
# commits — the pushed tag is the version record. The build job composes the
# notes into the GitHub Release body and the channel job embeds them in
# latest.json's `notes`.
#
# workflow_dispatch rebuilds the identical matrix for an existing ref with
# `publish` left false, so the pipeline can be smoke-tested (all three
# platforms, no release created) before cutting a real tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag or branch to build (e.g. v1.1.0, main)"
        required: true
        default: main
        type: string
      publish:
        description: "Create the GitHub Release + refresh the update channel"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  CHANNEL_TAG: updater-latest

jobs:
  # ── Resolve the version + frontend type gate ──
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          # full history + tags: notes are generated from the commits since
          # the last published release tag.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type-check and build
        run: npm run build

      - name: Resolve version (from the pushed tag)
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_VALUE: ${{ inputs.ref || github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # The pushed tag is the version record: CI syncs the version files
          # in-workspace (build job) instead of requiring a bump commit.
          # INPUT_REF arrives via env (not inline expansion) so a dispatch ref
          # can never inject into this script.
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          elif [ "$PUBLISH" = "true" ]; then
            TAG="$INPUT_REF"
            # A dispatch publish creates the Release for this tag; require the
            # real tag to exist first.
            gh api "repos/$REPO/git/ref/tags/$TAG" --silent || {
              echo "ERROR: tag $TAG does not exist on origin — cut it with 'npm run release vX.Y.Z'"; exit 1; }
          else
            TAG="$INPUT_REF"
            VERSION=$(awk -F'"' '/"version"/ {print $4; exit}' src-tauri/tauri.conf.json)
            if [ -z "$VERSION" ]; then
              echo "ERROR: could not read the version from src-tauri/tauri.conf.json"
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "smoke-building $TAG as v$VERSION from $REF_VALUE"
            exit 0
          fi
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag $TAG is not v<semver> — cut releases with 'npm run release vX.Y.Z'"; exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building $TAG from $REF_VALUE"

      - name: Game-interaction hard lines (TOS/CoC)
        shell: pwsh
        run: ./scripts/check-glogger-constraints.ps1

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes come from the commit-prefix convention (feat:/impv:/fix:)
          # since the last *published* GitHub Release, not the nearest tag: a
          # tag whose Release run failed never reached users, so the next
          # release's notes must still cover its commits. Checked out at the
          # new tag, so probe HEAD^ first — plain HEAD would resolve the new
          # tag itself as its own base.
          PREV_TAG=$(bash scripts/last-published-tag.sh "$REPO" 2>/dev/null || git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || echo "")
          echo "notes base: ${PREV_TAG:-the initial release}"
          mkdir -p release-notes
          bash scripts/generate-changelog.sh "$PREV_TAG" HEAD > release-notes/NOTES.md
          cat release-notes/NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/NOTES.md

  # ── Test once on Linux; the platform matrix below builds untested code
  # nowhere. The test *logic* is platform-independent (pure parsers, no
  # target-specific code under test), so running it 3× wasted ~7 min per
  # release; platform modules (`#[cfg(target_os)]` in stall_ocr.rs, lib.rs)
  # are compile-checked per-platform by the check step in build below.
  test:
    name: Rust tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' }}
      - name: Install Linux dependencies
        # cargo test compiles the full crate incl. Tauri/tao, which links
        # glib/webkit system libs. Same set as the build job's install.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  # ── Build every platform we ship ──
  build:
    name: Build release installers
    needs: [validate, test]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: write # tauri-action direct mode creates the Release + uploads bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
            target: ""
            args: ""
          - platform: macos-latest
            label: macos
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-latest
            label: linux
            target: ""
            args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Prepare apt cache dir
        if: matrix.platform == 'ubuntu-latest'
        # The runner user cannot write root-owned /var/cache/apt/archives;
        # without this the restore step below hard-fails on extraction.
        run: sudo mkdir -p /var/cache/apt/archives/partial && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Restore apt packages
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # /var/cache/apt/archives is the deb archive (~webkit-heavy).
          # Restores before install so the archives are warm. Two properties
          # bound the risk: apt re-verifies every deb against a freshly
          # fetched index (`apt-get update` runs uncached below), so a
          # poisoned entry fails closed at install; and only tag pushes save
          # (see the save step), so smoke-test dispatches on an arbitrary ref
          # can read but never write what releases read. Restore falls
          # through to the newest `apt-Linux-` prefix match, so a cold cache
          # or a skipped save just degrades to an uncached install.
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ github.run_id }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Save apt packages
        # Smoke-test dispatches restore but never save: only tag pushes write
        # the cache releases read. Mirrors the rust-cache save-if narrowing.
        # The key folds in run_attempt because cache/save refuses an exact-key
        # collision and run_id is stable across re-runs — without it a retry
        # after a save would fail on the already-reserved key. Restore still
        # hits via the `apt-<os>-` prefix fallthrough.
        if: matrix.platform == 'ubuntu-latest' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        # Master-history SHA, not the `stable` branch head: upstream force-pushes
        # `stable` on every toolchain release and non-master commits get GC'd
        # (upstream README requires a master-history SHA; a pinned stable head
        # goes dangling). `toolchain: stable` preserves the old `@stable` behavior.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Smoke-test dispatches restore but never save: only tag pushes write
          # the cache releases read. No pull_request trigger exists, so no
          # untrusted run can poison it; this narrows the writers to releases.
          save-if: ${{ github.event_name == 'push' }}
      - name: Sync version files to the release tag
        # CI is the version sync: the tag is the version record, so the
        # build workspaces get the tag version before compiling. Runs after
        # Setup Rust so bump-version.sh's `cargo update -p glogger
        # --precise` can refresh Cargo.lock for the locked check below.
        if: github.event_name == 'push' || inputs.publish == true
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bash scripts/bump-version.sh "$VERSION"
          grep -q "\"version\": \"$VERSION\"" src-tauri/tauri.conf.json

      - name: Compile-check tests per platform
        # The single Linux `test` job above runs the suite; this cheap check
        # type-checks `#[cfg(target_os)]` modules (stall_ocr.rs capture,
        # lib.rs) on Windows/mac so a platform-only break fails early, not in
        # the late tauri build. `--tests` covers test code without running it.
        working-directory: src-tauri
        run: cargo check --tests --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Download release notes
        if: github.event_name == 'push' || inputs.publish == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes/

      - name: Compose release body
        if: github.event_name == 'push' || inputs.publish == true
        id: body
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          {
            echo "Installed builds auto-update from the \`updater-latest\` channel."
            echo
            echo "---"
            echo
            cat release-notes/NOTES.md
            echo
            echo "---"
            echo
            echo "**Linux (Flatpak):** the Flatpak bundle is attached by a follow-up job shortly after publish; not self-updating."
            echo
            echo "Original app by Daniel Auchenpaugh ([danielout/glogger](https://github.com/danielout/glogger)). Features, fixes and the release pipeline inherited from the [oddio fork](https://github.com/crisp-oddio/glogger-oddio) by oddio — now maintained at [Glogger-Team/glogger](https://github.com/Glogger-Team/glogger)."
            echo
            echo "---"
            echo
            # Static per-platform footnote: kept at the bottom so the notes stay
            # at the top of the release page.
            echo "<sub>**macOS:** the \`.dmg\` is unsigned (no Apple Developer certificate) — on first launch use right-click → Open, or clear the quarantine flag with \`xattr -d com.apple.quarantine /Applications/glogger.app\`.</sub>"
          } > FULL_RELEASE_NOTES.md
          BODY=$(cat FULL_RELEASE_NOTES.md)
          {
            echo "body<<BODY_EOF"
            echo "$BODY"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + publish release installer
        if: github.event_name == 'push' || inputs.publish == true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: glogger ${{ needs.validate.outputs.tag }}
          releaseBody: ${{ steps.body.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          tauriScript: npx tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true

      - name: Build installer (smoke test, no release)
        if: ${{ !(github.event_name == 'push' || inputs.publish == true) }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true

  # ── Assemble latest.json + refresh the update channel (single writer) ──
  channel:
    name: Update release channel
    needs: [validate, build]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # downloads assets, attaches latest.json, moves the channel pointer
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes/

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The matrix created the Release as a draft; wait for all three
          # platforms' binaries plus their .sig companions to land before
          # assembling the channel manifest (binaries and signatures upload
          # sequentially, so a binary-only poll would hard-fail the
          # manifest step). `gh release download` reads drafts fine with
          # GH_TOKEN, so the draft stays invisible until channel publishes it.
          FOUND=0
          for i in $(seq 1 10); do
            rm -rf all-artifacts && mkdir -p all-artifacts
          if gh release download "$TAG" --repo "$REPO" --dir all-artifacts >/dev/null 2>&1 \
            && [ "$(ls all-artifacts/*setup.exe 2>/dev/null | wc -l)" -ge 1 ] \
            && [ "$(ls all-artifacts/*.app.tar.gz 2>/dev/null | grep -v '\.sig$' | wc -l)" -ge 1 ] \
            && [ "$(ls all-artifacts/*.AppImage 2>/dev/null | grep -v '\.sig$' | wc -l)" -ge 1 ] \
            && [ "$(ls all-artifacts/*setup.exe.sig 2>/dev/null | wc -l)" -ge 1 ] \
            && [ "$(ls all-artifacts/*.app.tar.gz.sig 2>/dev/null | wc -l)" -ge 1 ] \
            && [ "$(ls all-artifacts/*.AppImage.sig 2>/dev/null | wc -l)" -ge 1 ]; then
              echo "All platform assets present."
              FOUND=1
              break
            fi
            echo "  attempt $i/10 — assets incomplete, retrying in 30s"
            sleep 30
          done
          if [ "$FOUND" != 1 ]; then
            echo "ERROR: release $TAG assets never completed"
            ls -la all-artifacts/ || true
            exit 1
          fi
          ls -la all-artifacts/

      - name: Generate latest.json updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          ls -la all-artifacts/
          mkdir -p channel

          WIN_ASSET=$(ls all-artifacts/*setup.exe | grep -v '\.sig$' | head -1 | xargs basename)
          MAC_ASSET=$(ls all-artifacts/*.app.tar.gz | grep -v '\.sig$' | head -1 | xargs basename)
          LINUX_ASSET=$(ls all-artifacts/*.AppImage | grep -v '\.sig$' | head -1 | xargs basename)
          [ "$(ls all-artifacts/*setup.exe | grep -v '\.sig$' | wc -l)" = 1 ] || { echo "ERROR: expected exactly one *setup.exe"; ls all-artifacts/; exit 1; }
          [ "$(ls all-artifacts/*.app.tar.gz | grep -v '\.sig$' | wc -l)" = 1 ] || { echo "ERROR: expected exactly one *.app.tar.gz"; ls all-artifacts/; exit 1; }
          [ "$(ls all-artifacts/*.AppImage | grep -v '\.sig$' | wc -l)" = 1 ] || { echo "ERROR: expected exactly one *.AppImage"; ls all-artifacts/; exit 1; }
          MISSING=0
          for f in "all-artifacts/$WIN_ASSET.sig" "all-artifacts/$MAC_ASSET.sig" "all-artifacts/$LINUX_ASSET.sig"; do
            [ -f "$f" ] || { echo "ERROR: missing signature $f"; MISSING=1; }
          done
          [ "$MISSING" = 0 ] || exit 1

          # The updater manifest carries the same CI-generated notes the
          # GitHub Release shows.
          cp release-notes/NOTES.md updater-notes.md

          jq -n \
            --arg version "$VERSION" \
            --rawfile notes updater-notes.md \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg win_url "$BASE_URL/$WIN_ASSET" --arg win_sig "$(cat "all-artifacts/$WIN_ASSET.sig")" \
            --arg mac_url "$BASE_URL/$MAC_ASSET" --arg mac_sig "$(cat "all-artifacts/$MAC_ASSET.sig")" \
            --arg linux_url "$BASE_URL/$LINUX_ASSET" --arg linux_sig "$(cat "all-artifacts/$LINUX_ASSET.sig")" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "windows-x86_64": { url: $win_url, signature: $win_sig },
                 "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                 "linux-x86_64": { url: $linux_url, signature: $linux_sig }
               }
             }' > channel/latest.json

          python3 -m json.tool channel/latest.json
          echo "verified: latest.json parses"

      - name: Publish the release (all platform assets verified)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The matrix created the Release as a draft, so nothing public exists
          # until every platform's binary + .sig has been verified above.
          # A failed platform build leaves a draft (never a partial public
          # Release); the retry rule is a new version tag, never retagging.
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "published: https://github.com/$REPO/releases/tag/$TAG"

      - name: Attach latest.json to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" channel/latest.json --repo "$REPO" --clobber
          echo "attached: https://github.com/$REPO/releases/download/$TAG/latest.json"

      - name: Update the update-channel pointer release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$CHANNEL_TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$CHANNEL_TAG" --repo "$REPO" \
              --title 'Update channel' --latest=false \
              --notes 'Pointer release: holds latest.json for the app updater endpoint. Replaced on every v* release — do not delete.'
          gh release upload "$CHANNEL_TAG" channel/latest.json --repo "$REPO" --clobber
          echo "channel updated: https://github.com/$REPO/releases/download/$CHANNEL_TAG/latest.json"

  # ── Flatpak bundle, built from the published tag (Linux extra, upstream parity) ──
  flatpak:
    needs: [validate, channel]
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    # Local-path syntax (./...): same-repo callee, resolved by GitHub —
    # not subject to checkout filesystem state, and counts as pinned under a
    # fully-pinned repo policy. Always tracks the current ref's flatpak.yml.
    uses: ./.github/workflows/flatpak.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      publish: true
    permissions:
      contents: write # the called workflow's attach job uploads the bundle
