# PR path filter: the `changes` job (first job) classifies changed files
# into per-slice filter outputs (one boolean per scope) with pinned
# dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad (# v4.0.3).
# No job gates on these outputs yet — gating lands in #132/#133/#134.
# PR gates on PRs and main pushes: frontend type-check/build, Rust tests
# (plus clippy `-D warnings` on all targets), plus fast local-feedback
# linters. CI calls each `mise run lint:*` slice individually (the check
# list and every tool version live in exactly one place (`mise.toml`));
# local gates are two entrypoints: the pre-commit hook runs `lint:fast`
# (commit set, seconds-scale), the pre-push hook runs `lint` (push set:
# fast + markdown-push + parity-push + typecheck + clippy). The full gate
# is manual `mise run lint:full` (push set + test + audit + constraints);
# only the full vite bundle (`lint:build`) is CI-only — too slow even for
# push. Rust (rustfmt) stays advisory in
# AGENTS.md (823 unformatted spots pre-existing); markdown is a
# changed-files gate (all hand-maintained docs except generated
# CHANGELOG.md) — only the green gates run here. The release workflow
# re-runs the frontend build, Rust tests, and TOS scan before bundling
# (its `validate` + `test` jobs);

name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ruff: ${{ steps.filter.outputs.ruff }}
      yamllint: ${{ steps.filter.outputs.yamllint }}
      actions: ${{ steps.filter.outputs.actions }}
      markdown: ${{ steps.filter.outputs.markdown }}
      frontend: ${{ steps.filter.outputs.frontend }}
      grids: ${{ steps.filter.outputs.grids }}
      review: ${{ steps.filter.outputs.review }}
      rust: ${{ steps.filter.outputs.rust }}
      audit: ${{ steps.filter.outputs.audit }}
      run-all: ${{ steps.filter.outputs.run-all }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v4.0.3
        with:
          filters: |
            ruff:
              - 'scripts/**'
            yamllint:
              - '**/*.yml'
              - '**/*.yaml'
            actions:
              - '.github/**'
            markdown:
              - '**/*.md'
            frontend:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'dev-panel.html'
            grids:
              - 'src/**/*.vue'
            review:
              - 'src-tauri/src/db/migrations.rs'
            rust:
              - 'src-tauri/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
            audit:
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'scripts/cargo-audit-gate.py'
            run-all:
              - '.github/workflows/lint.yml'

      - name: Log filter outputs
        env:
          FILTER_RUFF: ${{ steps.filter.outputs.ruff }}
          FILTER_YAMLLINT: ${{ steps.filter.outputs.yamllint }}
          FILTER_ACTIONS: ${{ steps.filter.outputs.actions }}
          FILTER_MARKDOWN: ${{ steps.filter.outputs.markdown }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_GRIDS: ${{ steps.filter.outputs.grids }}
          FILTER_REVIEW: ${{ steps.filter.outputs.review }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_AUDIT: ${{ steps.filter.outputs.audit }}
          FILTER_RUN_ALL: ${{ steps.filter.outputs.run-all }}
        run: |
          echo "ruff=$FILTER_RUFF"
          echo "yamllint=$FILTER_YAMLLINT"
          echo "actions=$FILTER_ACTIONS"
          echo "markdown=$FILTER_MARKDOWN"
          echo "frontend=$FILTER_FRONTEND"
          echo "grids=$FILTER_GRIDS"
          echo "review=$FILTER_REVIEW"
          echo "rust=$FILTER_RUST"
          echo "audit=$FILTER_AUDIT"
          echo "run-all=$FILTER_RUN_ALL"

  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and tools
        # No third-party action (org allowlist): official installer script.
        # `mise install` / `mise run` trust the active config automatically,
        # so no explicit `mise trust` step.
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Ruff check and format
        # Same `mise run lint:ruff` slice the pre-commit hook runs.
        run: mise run lint:ruff

  commit-msg:
    name: Commit-msg hook contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and tools
        # No third-party action (org allowlist): official installer script.
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Commit-msg self-test
        # Same `mise run lint:commit` slice the pre-commit hook runs.
        # The hook is scripts/check-commit-msg.py (warning-only).
        run: mise run lint:commit

  cargo-audit:
    name: Cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # #134: runs when Cargo manifests or the gate script change; else the
    # audit step skips and the note below exits green.
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and tools
        # No third-party action and no toolchain-install step (org
        # allowlist): official installer script; ubuntu-latest ships stable
        # Rust, and cargo-audit never compiles, so runner Rust is
        # sufficient (release.yml keeps pinned dtolnay for the
        # cross-platform builds that need it).
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Install cargo-audit
        # Floor, not a freeze: no watcher here, so a freeze would rot silently.
        if: needs.changes.outputs.audit == 'true'
        run: set -euo pipefail; cargo install cargo-audit --locked

      - name: Audit (fail on critical/high only)
        # Same `mise run lint:audit` slice (`lint:full` full gate; CI runs
        # every slice individually): scripts/cargo-audit-gate.py owns
        # ignores + scoring.
        if: needs.changes.outputs.audit == 'true'
        run: mise run lint:audit

      - name: No relevant changes (audit skipped)
        if: always()
        run: |
          echo "audit=${{ needs.changes.outputs.audit }}"
          if [ "${{ needs.changes.outputs.audit }}" = "true" ]; then
            echo "audit scope touched: advisory check ran."
          else
            echo "No relevant changes: cargo audit skipped (exit 0)."
          fi

  yaml:
    name: YAML and Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and tools
        # No third-party action and no setup-python step (org allowlist):
        # official installer script; mise provides python + yamllint +
        # zizmor + pinact from mise.toml, same as local.
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: YAML and Actions (yamllint + zizmor + pinact)
        # Same `mise run lint:yaml` slice the pre-commit hook runs — pinact
        # now gates CI too (green on HEAD; was local-only because
        # pinact-action is uninstallable on stock runners).
        # GITHUB_TOKEN keeps pinact's tag-lookup API calls authenticated
        # (5k/hr vs 60/hr anonymous — the anonymous pool exhausts on busy
        # repos). Local runs stay tokenless; CI-only difference.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run lint:yaml

      - name: Lint-parity drift guard
        # Same `mise run lint:parity` slice the pre-commit hook runs (via
        # `mise run lint:fast`): hook/docs refs resolve, TODO location
        # contract holds, fast-set stays seconds-scale.
        run: mise run lint:parity
      - name: Validate pre-commit config
        run: mise exec -- pre-commit validate-config

  markdown:
    name: Markdown (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Changed-files gating needs the base commit; default depth-1
          # checkout can't diff against it.
          fetch-depth: 0

      - name: Install mise and tools
        # No third-party action (org allowlist): official installer script;
        # mise provides node + python + markdownlint-cli2 from mise.toml.
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Markdown lint (changed hand-maintained docs)
        # Scope lives in scripts/lint-markdown-changed.py (single source of
        # truth with `mise run lint:markdown`): all *.md except CHANGELOG.md
        # (generator-rewritten each release). Grandfathered: only changed
        # files are linted. Base is the PR base sha on pull_request, the push
        # `before` sha on main pushes (zero-sha on manual dispatch falls
        # back to HEAD~1).
        # Base selection is the one sanctioned invocation difference;
        # the binary and scope logic are shared via mise + the script.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          mise exec -- python scripts/lint-markdown-changed.py --base "$BASE"

  frontend:
    name: Frontend type-check and build
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log gate inputs (#133)
        # Reads the path-filter outputs this job gates on; informational only.
        env:
          GATE_FRONTEND: ${{ needs.changes.outputs.frontend }}
          GATE_GRIDS: ${{ needs.changes.outputs.grids }}
          GATE_REVIEW: ${{ needs.changes.outputs.review }}
        run: |
          echo "frontend=$GATE_FRONTEND"
          echo "grids=$GATE_GRIDS"
          echo "review=$GATE_REVIEW"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Tracks latest LTS to match mise.toml `node = "lts"` locally.
          node-version: "lts/*"
          cache: npm

      - name: Install mise
        # No third-party action (org allowlist): official installer script;
        # setup-node keeps the npm cache (mise-managed node can't restore it).
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Install frontend dependencies
        # Shared by the type-check/build and grids steps (both run on node);
        # skipped only when neither scope needs it.
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.grids == 'true'
        run: npm ci
      - name: Frontend type-check and build
        # CI-only `mise run lint:build` slice (full vite bundle — too slow
        # even for push, which runs `lint:typecheck` instead via `mise run
        # lint`). Would have caught the TS 7 major: vue-tsc crashes on
        # its removed './lib/tsc' export before checking a single file.
        if: needs.changes.outputs.frontend == 'true'
        run: mise run lint:build

      - name: Frontend gate note
        # Always-run companion: names whether the frontend scope ran or skipped.
        if: always()
        run: |
          echo "frontend scope: ${{ needs.changes.outputs.frontend == 'true' && 'ran' || 'skipped (no frontend paths changed)' }}"

      - name: Grid standards
        # Same `mise run lint:grids` slice (`lint:fast` commit set, also in
        # push `lint`).
        if: needs.changes.outputs.grids == 'true'
        run: mise run lint:grids

      - name: Grids gate note
        # Always-run companion: names whether the grids scope ran or skipped.
        if: always()
        run: |
          echo "grids scope: ${{ needs.changes.outputs.grids == 'true' && 'ran' || 'skipped (no src/**/*.vue changed)' }}"

      - name: Game-interaction hard lines (TOS/CoC)
        # Same `mise run lint:constraints` slice (`lint:full` full gate —
        # no longer in push `lint`; CI + manual stage A + release
        # `validate` enforce). UNGATED: always runs, so the job exits 0
        # with a real check even when every gated scope skips.
        shell: pwsh
        run: mise run lint:constraints

      - name: Review-patterns gate (decided defect shapes)
        # Same `mise run lint:review` slice (`lint:fast` commit set, also
        # in push `lint`).
        if: needs.changes.outputs.review == 'true'
        shell: bash
        run: mise run lint:review

      - name: Review gate note
        # Always-run companion: names whether the review scope ran or skipped.
        if: always()
        run: |
          echo "review scope: ${{ needs.changes.outputs.review == 'true' && 'ran' || 'skipped (no review paths changed)' }}"

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # #134: test + clippy share one scope (src-tauri + Cargo manifests);
    # checkout/cache/apt/mise setup stay unconditional, heavy steps gate.
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # PR runs restore but never save: only pushes write the cache
          # releases read, so no untrusted run can poison it. Same narrowing
          # as release.yml; save-if is false on pull_request and
          # workflow_dispatch alike.
          save-if: ${{ github.event_name == 'push' }}

      - name: Prepare apt cache dir
        # The runner user cannot write root-owned /var/cache/apt/archives;
        # without this the restore step below hard-fails on extraction.
        # Same preamble as release.yml's build job.
        run: sudo mkdir -p /var/cache/apt/archives/partial && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Restore apt packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Same narrowing rationale as the Rust cache: apt re-verifies every
          # deb against a freshly fetched index, so a poisoned entry fails
          # closed at install; only main pushes save (see below), so
          # smoke-test dispatches and fork PRs can read but never write what
          # PR/main runs consume. Cold cache degrades to an uncached install.
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ github.run_id }}-${{ hashFiles('.github/workflows/lint.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install Linux dependencies
        # cargo test compiles the full crate incl. Tauri/tao, which links
        # glib/webkit system libs. Same set as release.yml's test job.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Save apt packages
        # Main pushes only: PR/dispatch runs restore but never save. The key
        # folds in run_attempt because cache/save refuses an exact-key
        # collision and run_id is stable across re-runs — without it a retry
        # after a save would fail on the already-reserved key. Restore still
        # hits via the `apt-<os>-` prefix fallthrough.
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ hashFiles('.github/workflows/lint.yml') }}

      - name: Install mise
        # No third-party action (org allowlist): official installer script.
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Rust tests
        # Same `mise run lint:test` slice (`lint:full` full gate; CI runs
        # every slice individually).
        if: needs.changes.outputs.rust == 'true'
        run: mise run lint:test

      - name: Clippy (deny warnings)
        # Same `mise run lint:clippy` slice (push `lint` keeps it).
        if: needs.changes.outputs.rust == 'true'
        run: mise run lint:clippy

      - name: No relevant changes (rust skipped)
        if: always()
        run: |
          echo "rust=${{ needs.changes.outputs.rust }}"
          if [ "${{ needs.changes.outputs.rust }}" = "true" ]; then
            echo "rust scope touched: tests + clippy ran."
          else
            echo "No relevant changes: rust tests + clippy skipped (exit 0)."
          fi
