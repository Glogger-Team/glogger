# Fast local-feedback linters on PRs and main pushes. Rust (clippy/rustfmt)
# and markdown stay advisory in AGENTS.md (823 unformatted spots, 167 clippy
# findings, 6k+ markdown findings pre-existing) — only the green gates run
# here. The release workflow's `validate` job owns the type/test gates.

name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: ./scripts
          args: check --output-format github

      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: ./scripts
          args: format --check --diff

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

      - name: ShellCheck githooks
        # Extensionless hook files need `additional_files` — the action's
        # default find only matches known shell extensions plus executable
        # extensionless files, and the hooks are checked in 644. Names here
        # are `-name *<value>` fragments, scanned unconditionally (unlike
        # the default search they are not shebang-gated) — keep this list
        # to exactly the two hooks.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./.githooks
          additional_files: 'pre-push commit-msg'
          severity: warning

  cargo-audit:
    name: Cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain-install step: ubuntu-latest ships stable Rust, and the
      # org allowlist permits no new third-party actions. cargo-audit never
      # compiles, so runner Rust is sufficient (release.yml keeps pinned
      # dtolnay for the cross-platform builds that need it).
      - name: Install cargo-audit
        # Floor, not a freeze: no watcher here, so a freeze would rot silently.
        run: set -euo pipefail; cargo install cargo-audit --locked

      - name: Audit (fail on critical/high only)
        run: |
          set -euo pipefail
          # Gate logic lives in scripts/cargo-audit-gate.py — the single source
          # of truth shared with `mise run lint` (ignores + scoring in one place).
          python3 scripts/cargo-audit-gate.py --summary "$GITHUB_STEP_SUMMARY"

  yaml:
    name: YAML and Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: yamllint
        # Floor, not a freeze: keeps a known-good minimum, still floats with
        # upstream. No watcher here, so a freeze would rot silently.
        run: pip install "yamllint>=1.37.1" && yamllint .github/

      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/
          online-audits: false
          config: .github/zizmor.yml
          min-severity: medium
          advanced-security: false

      - name: pinact
        uses: suzuki-shunsuke/pinact-action@2a42f29b3397967439ed46e7650f3045f49699f9 # v3.0.1
        with:
          fix: "false"
          verify: "true"

  markdown:
    name: Markdown (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Markdown lint (hand-maintained docs only)
        # Floor, not a freeze: no watcher here, so a freeze would rot silently.
        run: npx --yes markdownlint-cli2@0.23 --config .markdownlint-cli2.json "AGENTS.md" "README.md" "SECURITY.md" "CONTRIBUTING.md"
