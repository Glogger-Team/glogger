name: Flatpak

# Builds the Linux Flatpak bundle for a release tag and attaches it to that
# release. Ported from the oddio fork's flatpak.yml (same GNOME builder image +
# offline-source generators); the app id is this fork's.
#
# This fork's `npm run release` pushes the tag from the dev machine, so a
# `push: tags` trigger would race the Release workflow's own call. Instead the
# Release workflow invokes this as `workflow_call` once the release is published,
# and `workflow_dispatch` builds a bundle on its own for smoke-testing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) — or any ref when publish=false (smoke test)"
        required: true
        type: string
      publish:
        description: "Attach the bundle to that GitHub Release"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build & attach the Flatpak to"
        required: true
        type: string
      publish:
        description: "Attach the bundle to that GitHub Release"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: flatpak-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TARGET_TAG: ${{ inputs.tag }}

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # flatpak-builder + the GNOME SDK only exist inside the official Flatpak
    # builder image, not on the bare runner.
    container:
      # Pinned by digest once resolvable (no docker here to read it): the
      # `gnome-50` tag moves. Re-pin with
      # `docker buildx imagetools inspect <image> --format '{{json .Manifest}}'`.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_TAG }}
          persist-credentials: false

      # The release workflow always passes the vetted release tag; a dispatched
      # smoke test may pass any ref (e.g. `main`) as long as it does not publish,
      # so only enforce the v<semver> shape on the publishing path. `git` cannot
      # reach `origin` from inside the builder container, so this is shape-only:
      # the ref itself is a checkout ref (a bad one fails the checkout above).
      - name: Check the ref is sane for this mode
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            case "$TARGET_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "ERROR: '${TARGET_TAG}' is not a v<semver> release tag"; exit 1 ;;
            esac
          fi
          echo "building Flatpak from ${TARGET_TAG} (publish=$PUBLISH)"

      # ── Generate offline source manifests ───────────────────────────────
      # Flatpak build environments have no internet access, so all Cargo and npm
      # dependencies must be pre-fetched into source lists flatpak-builder can
      # cache-populate before the build runs.

      # The cargo generator is still a standalone script (needs aiohttp + tomlkit).
      # The node generator lives in a Python package — install it from the git
      # subdirectory, which also handles newer nested node_modules layouts
      # (e.g. Tailwind's oxide-wasi). Use a venv so pip works regardless of the
      # container's PEP 668 policy. No --quiet: on the gnome-50 image the install
      # "succeeded" silently while the console script never appeared, so keep pip
      # output visible.
      - name: Install offline-source generators
        run: |
          python3 -m venv /tmp/gen
          /tmp/gen/bin/pip install aiohttp tomlkit
          /tmp/gen/bin/pip install "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"
          # Sanity check: run as a module — where pip places console scripts
          # varies across builder images (bin/ vs local/bin), the module doesn't.
          /tmp/gen/bin/python -m flatpak_node_generator --help >/dev/null

      - name: Download flatpak-cargo-generator
        run: |
          curl -sSL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py

      - name: Generate Cargo offline sources
        run: |
          /tmp/gen/bin/python /tmp/flatpak-cargo-generator.py \
            src-tauri/Cargo.lock \
            -o flatpak/generated-cargo-sources.json

      - name: Generate npm offline sources
        run: |
          /tmp/gen/bin/python -m flatpak_node_generator npm package-lock.json \
            -o flatpak/generated-node-sources.json

      # ── Build Flatpak ───────────────────────────────────────────────────

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: glogger.flatpak
          manifest-path: flatpak/io.github.cprivitere.glogger.yml
          cache: true
          cache-key: flatpak-${{ hashFiles('src-tauri/Cargo.lock', 'package-lock.json') }}

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glogger-flatpak
          path: glogger.flatpak

  # Attaching runs on a bare runner because the builder container has no gh CLI.
  attach:
    name: Attach bundle to release
    needs: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # uploads the bundle to the release
    if: ${{ inputs.publish == true && inputs.tag != '' }}
    steps:
      - name: Download built bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glogger-flatpak

      - name: Attach bundle to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="${TARGET_TAG}"
          echo "Waiting for release $TAG to exist..."
          FOUND=0
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG found."
              FOUND=1
              break
            fi
            echo "  attempt $i/30 — not yet, retrying in 60s"
            sleep 60
          done
          if [ "$FOUND" != 1 ]; then
            echo "ERROR: release $TAG never appeared — nothing to attach the Flatpak to"
            exit 1
          fi
          gh release upload "$TAG" glogger.flatpak \
            --repo "$REPOSITORY" \
            --clobber
