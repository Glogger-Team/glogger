name: Retired-noun audit

# Weekly, never-blocking run of the doc-orphans whole-tree `--audit` mode
# (scripts/check-doc-orphans.py, stdlib-only, seconds to run): every
# symbol-shaped reference in every doc checked against all live definitions
# in src-tauri/src. The worker run that motivated this workflow found
# thousands of raw findings, mostly Vue/CDN/CSS nouns the .rs live scan
# cannot see — dozens of lines per component name, each group a single
# triage decision, not dozens.
#
# Scoping choice (triage-pair first): the audit INPUT is deliberately
# unscoped — whole-tree is the point, and the #327 triage proved real hits
# hide among the noise, so any shell-side exclusion would re-implement gate
# semantics and risk dropping signal. Scoping happens at the triage surface
# instead: the artifact carries the raw log plus a triage index (per-token
# and per-file counts, most frequent first) that collapses frontend-owned
# noise into single accept-or-fix decisions. Pairs work top-down from the
# index and grep the raw log for locations.
#
# Never-blocking shape: both steps carry `continue-on-error: true`, the
# upload runs `if: always()`, so the workflow stays green whatever the audit
# finds or if artifact upload flakes.
# Consumers: triage pairs reading the uploaded `retired-noun-audit` artifact.
#
# No `mise run lint:audit` here: that slice is the fail-closed cargo-audit
# (RustSec) gate, a different audit, and there is no natural slot for a
# doc-audit task under that name. This workflow invokes the doc-orphans
# script directly (runner python3 suffices with no mise install — same
# precedent as flatpak.yml's version-sync step).

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: retired-noun-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Retired-noun audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run doc-orphans whole-tree audit (never blocking)
        id: audit
        # Advisory by design (see header): findings must never fail the run.
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 scripts/check-doc-orphans.py --audit > retired-noun-audit.txt 2>&1
          audit_code=$?
          # Triage index: collapse the raw `relpath:line: token` lines into
          # per-token and per-file counts (most frequent first) so triage
          # pairs get one decision per stale name instead of thousands of raw
          # lines. Lossless by construction: the grep keeps exactly the
          # finding-shaped lines; the raw log keeps everything.
          {
            echo "## retired-noun audit triage index"
            echo "## full findings: retired-noun-audit.txt (relpath:line: token)"
            echo "## pick a token, grep it in the full log for locations;"
            echo "## one decision per token: accept as frontend-owned or fix the doc."
            echo ""
            echo "## by token (count token, most frequent first)"
            grep -E '^[^:]+:[0-9]+: [^ ]+$' retired-noun-audit.txt \
              | awk -F': ' '{c[$2]++} END {for (t in c) printf "%d %s\n", c[t], t}' \
              | sort -rn
            echo ""
            echo "## by file (count path, densest first)"
            grep -E '^[^:]+:[0-9]+: [^ ]+$' retired-noun-audit.txt \
              | cut -d: -f1 | sort | uniq -c | sort -rn
          } > retired-noun-triage.txt
          exit "$audit_code"

      - name: Upload audit findings
        if: always()
        # Artifact-service flakes must never fail this advisory workflow.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retired-noun-audit
          path: |
            retired-noun-audit.txt
            retired-noun-triage.txt
