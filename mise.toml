[tools]
# Gated in CI (lint.yml) — float latest, same as CI's floor-not-freeze policy.
zizmor = "latest"
ruff = "latest"
yamllint = "latest"
pinact = "latest"
# Hook runner only — its version never affects lint results.
"pipx:pre-commit" = "latest"
# Ad-hoc use, not gated: jactionlint replaces actionlint wherever actionlint
# would be called (actionlint's cache-poisoning rule can't ignore accepted drift).
jactionlint = "latest"
# Opt-in / advisory only (see AGENTS.md Linting table).
"npm:markdownlint-cli2" = "latest"
# Runtime for npx-based linters; matches package.json engines.
node = "lts"
# Runtime for scripts/cargo-audit-gate.py (CI uses runner python3).
python = "latest"

[tasks."lint:ruff"]
description = "Ruff check + format on scripts/ (commit-fast slice)"
run = ["ruff check scripts/", "ruff format --check scripts/"]

[tasks."lint:commit"]
description = "Commit-msg hook self-test (commit-fast slice)"
run = ["python scripts/check-commit-msg.py --self-test"]

[tasks."lint:yaml"]
description = "yamllint + zizmor + pinact on .github/ (commit-fast slice)"
run = [
  "yamllint .github/",
  "zizmor -o --config \"{{config_root}}/.github/zizmor.yml\" \"{{config_root}}/.github/workflows/\"",
  "pinact run --check",
]
[tasks."lint:workflow"]
description = "Workflow expression identifiers + LF policy (.github/workflows, commit-fast slice)"
run = ["python scripts/check-workflow-expressions.py"]

[tasks."lint:markdown"]
description = "Changed-files markdown gate: worktree files + unpushed commits (commit-fast slice)"
# Commit/push hooks invoke with no --base: the script lints staged +
# unstaged + untracked files plus files changed in unpushed commits (the
# latter is what makes the pre-push hook meaningful on a clean tree). CI
# passes --base explicitly (PR base / push `before`) — the one sanctioned
# invocation difference, scope logic stays in
# scripts/lint-markdown-changed.py.
run = ["python scripts/lint-markdown-changed.py"]

[tasks."lint:markdown-push"]
description = "Pre-push Markdown: unpushed-commit files only, fail on staged overlap (push slice)"
# --push reads worktree bytes, so any file that differs between HEAD and
# the worktree would mask the committed content being pushed. Fail closed
# listing those files instead. Commit-hook (lint:fast) path never runs
# this, so amend/refine flows are unaffected.
run = ["python scripts/lint-markdown-changed.py --push"]

[tasks."lint:grids"]
description = "Grid standards census (commit-fast slice; python stdlib only, no install needed)"
run = ["npm run check:grids"]

[tasks."lint:review"]
description = "Review-patterns gate: decided defect shapes (commit-fast slice)"
run = ["python scripts/check-review-patterns.py"]

[tasks."lint:parity"]
description = "Lint-parity drift guard: hook/docs refs resolve, TODO location contract, fast-set weight (commit-fast slice)"
# Fails closed on drift between mise.toml (single source of truth),
# .pre-commit-config.yaml entries, AGENTS.md mentions, and the TODO.md
# location contract — the stringly-typed seams the parity work left behind.
run = ["python scripts/check-lint-parity.py"]

[tasks."lint:parity-push"]
description = "Pre-push parity: fail on worktree divergence in config sources (push slice)"
# --push fails closed listing source files that differ worktree-vs-HEAD
# (the checks read worktree bytes but certify the pushed revision).
# Commit-hook path never runs this: config edits are legitimately
# divergent at commit time.
run = ["python scripts/check-lint-parity.py --push"]

[tasks."lint:build"]
description = "Frontend type-check and full bundle (CI/release slice; NOT in lint — too slow for push)"
run = ["npm run build"]

[tasks."lint:typecheck"]
description = "Frontend type-check only, no bundle (push slice)"
run = ["npm run typecheck"]

[tasks."lint:clippy"]
description = "Clippy deny-warnings on all targets (push slice)"
dir = "src-tauri"
run = ["cargo clippy --all-targets -- -D warnings"]

[tasks."lint:test"]
description = "Rust unit tests (full slice; mirrors lint.yml rust-tests job)"
dir = "src-tauri"
run = ["cargo test --lib"]

[tasks."lint:audit"]
description = "Fail-closed cargo-audit gate (full slice; logic in scripts/cargo-audit-gate.py)"
run = ["python scripts/cargo-audit-gate.py"]

[tasks."lint:constraints"]
description = "Game-interaction hard lines (full slice)"
run = ["python scripts/check-glogger-constraints.py"]

[tasks."lint:fast"]
description = "Commit stage: seconds-scale checks, no build/test/network"
depends = ["lint:ruff", "lint:commit", "lint:yaml", "lint:workflow", "lint:markdown", "lint:grids", "lint:review", "lint:parity"]

[tasks.lint]
description = "Push-weight gates (pre-push hook entrypoint; manual stage A runs lint:full, CI adds lint:build)"
# Single entrypoint the pre-push hook calls: lint:fast slices plus the
# push slices (markdown-push + parity-push + typecheck + clippy).
# Full-weight slices (test/audit/constraints) live in `lint:full` (manual
# stage A; CI runs every slice individually) — the full vite bundle
# (lint:build) stays CI-only on top of lint:typecheck. Adding a check
# means adding it to one slice task above; it lands everywhere with no
# second list to update.
# Sequential array (NOT depends): parallel depends would race src-tauri
# builds against tree walks. lint:fast stays a parallel depends list
# (pure reads, no tree mutation).
run = [
  "mise run lint:fast",
  "mise run lint:markdown-push",
  "mise run lint:parity-push",
  "mise run lint:typecheck",
  "mise run lint:clippy",
]

[tasks."lint:full"]
description = "Full gate: push set plus test/audit/constraints (manual stage A; CI runs slices individually + lint:build)"
run = [
  "mise run lint",
  "mise run lint:test",
  "mise run lint:audit",
  "mise run lint:constraints",
]

[tasks.review-local]
description = "Pre-push local review prep: fact rows + frozen diff stat for the local-review skill"
run = [
  "npm run build",
  "npm run check:grids",
  "git rev-parse --short HEAD",
  "git status --porcelain",
  "git diff -w --stat HEAD",
]
[tasks."lint:all"]
description = "lint:full plus advisory rustfmt"
depends = ["lint:full"]
run = [
  "cd src-tauri && cargo fmt -- --check || true",
]
