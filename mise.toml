[tools]
# Gated in CI (lint.yml) — float latest, same as CI's floor-not-freeze policy.
zizmor = "latest"
ruff = "latest"
shellcheck = "latest"
yamllint = "latest"
pinact = "latest"
# Hook runner only — its version never affects lint results.
"pipx:pre-commit" = "latest"
# Ad-hoc use, not gated: jactionlint replaces actionlint wherever actionlint
# would be called (actionlint's cache-poisoning rule can't ignore accepted drift).
jactionlint = "latest"
# Opt-in / advisory only (see AGENTS.md Linting table).
"npm:markdownlint-cli2" = "latest"
# Runtime for npx-based linters; matches package.json engines.
node = "lts"
# Runtime for scripts/cargo-audit-gate.py (CI uses runner python3).
python = "latest"

[tasks."lint:ruff"]
description = "Ruff check + format on scripts/ (commit-fast slice)"
run = ["ruff check scripts/", "ruff format --check scripts/"]

[tasks."lint:shell"]
description = "ShellCheck on scripts/*.sh at warning severity (commit-fast slice)"
run = ["python -c \"import glob, subprocess, sys; sys.exit(subprocess.run(['shellcheck', '-S', 'warning'] + glob.glob('scripts/*.sh')).returncode)\""]

[tasks."lint:yaml"]
description = "yamllint + zizmor + pinact on .github/ (commit-fast slice)"
run = [
  "yamllint .github/",
  "zizmor --no-online-audits --config \"{{config_root}}/.github/zizmor.yml\" --min-severity medium \"{{config_root}}/.github/workflows/\"",
  "pinact run --check",
]

[tasks."lint:markdown"]
description = "Changed-files markdown gate, worktree mode (commit-fast slice)"
# Commit/push hooks invoke with no --base: the script lints staged +
# unstaged + untracked files. CI passes --base explicitly (PR base / push
# before) — the one sanctioned invocation difference, scope logic stays in
# scripts/lint-markdown-changed.py.
run = ["python scripts/lint-markdown-changed.py"]

[tasks."lint:grids"]
description = "Grid standards census (commit-fast slice; node: builtins only, no install needed)"
run = ["npm run check:grids"]

[tasks."lint:review"]
description = "Review-patterns gate: decided defect shapes (commit-fast slice)"
run = ["bash scripts/check-review-patterns.sh"]

[tasks."lint:build"]
description = "Frontend type-check and build (push/full slice)"
run = ["npm run build"]

[tasks."lint:clippy"]
description = "Clippy deny-warnings on all targets (push/full slice)"
dir = "src-tauri"
run = ["cargo clippy --all-targets -- -D warnings"]

[tasks."lint:test"]
description = "Rust unit tests (push/full slice; mirrors lint.yml rust-tests job)"
dir = "src-tauri"
run = ["cargo test --lib"]

[tasks."lint:audit"]
description = "Fail-closed cargo-audit gate (push/full slice; logic in scripts/cargo-audit-gate.py)"
run = ["python scripts/cargo-audit-gate.py"]

[tasks."lint:constraints"]
description = "Game-interaction hard lines (push/full slice)"
run = ["pwsh -NoProfile -File scripts/check-glogger-constraints.ps1"]

[tasks."lint:fast"]
description = "Commit stage: seconds-scale checks, no build/test/network"
depends = ["lint:ruff", "lint:shell", "lint:yaml", "lint:markdown", "lint:grids", "lint:review"]

[tasks.lint]
description = "Blocking lint gates (CI lint.yml set, runnable locally)"
# Single entrypoint CI and the pre-push hook both call: lint:fast slices
# plus the push/full slices. Adding a check means adding it to one slice
# task above; it lands everywhere with no second list to update.
# Sequential array (NOT depends): depends lists run in parallel, and
# lint:test / lint:clippy compiling into src-tauri/target races
# lint:constraints' tree walk (missing-dir read error). Array entries run
# in order — same shape as the old `lint` task. lint:fast stays a parallel
# depends list (pure reads, no tree mutation).
run = [
  "mise run lint:fast",
  "mise run lint:build",
  "mise run lint:clippy",
  "mise run lint:test",
  "mise run lint:audit",
  "mise run lint:constraints",
]

[tasks.review-local]
description = "Pre-push local review prep: fact rows + frozen diff stat for the local-review skill"
run = [
  "npm run build",
  "npm run check:grids",
  "git rev-parse --short HEAD",
  "git status --porcelain",
  "git diff -w --stat HEAD",
]
[tasks."lint:all"]
description = "lint plus advisory rustfmt"
depends = ["lint"]
run = [
  "cd src-tauri && cargo fmt -- --check || true",
]
